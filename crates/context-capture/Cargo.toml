[package]
name = "context-capture"
description = "Analyse, then delete: focused-window capture into sealed memfds, damage tiles, crops, OCR and captions, secret checks, then zeroize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
context-core = { workspace = true }
context-collect = { workspace = true }
context-infer = { workspace = true }
context-infer-client = { workspace = true }
context-shm = { workspace = true }
context-policy = { workspace = true }
getrandom = { workspace = true }
lru = { workspace = true }
rustix = { workspace = true, features = ["event", "process"] }
thiserror = { workspace = true }
tracing = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
xxhash-rust = { workspace = true }
zeroize = { workspace = true }

# The workspace forbids unsafe code, and a crate cannot relax `forbid`. This crate denies it
# instead, and only `util::frame_memory` (mmap, mlock, madvise, munmap) allows it.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
large_enum_variant = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
cast_possible_truncation = "warn"
cast_lossless = "warn"
missing_const_for_fn = "warn"
