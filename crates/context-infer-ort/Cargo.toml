[package]
name = "context-infer-ort"
description = "ONNX Runtime backend of the model layer: OCR and text embeddings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
context-infer = { workspace = true }
crownos-config = { workspace = true }
dirs = { workspace = true }
# The provider features only add bindings; with load-dynamic nothing is linked or fetched.
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
  "load-dynamic",
  "api-18",
  "cuda",
  "tensorrt",
  "openvino",
  "migraphx",
  "vitis",
] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tracing = { workspace = true }

[lints]
workspace = true
