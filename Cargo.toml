[workspace]
resolver = "3"
members = [
    "crates/context-core",
    "crates/context-protocol",
    "crates/context-policy",
    "crates/context-collect",
    "crates/context-store",
    "crates/context-engine",
    "crates/context-capture",
    "crates/context-infer",
    "crates/context-shm",
    "crates/context-infer-ort",
    "crates/context-infer-llama",
    "crates/crown-contextd",
    "crates/crown-context",
    "eval",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crown-os/crownos-visual-context-engine"

[workspace.dependencies]
context-core = { path = "crates/context-core" }
context-protocol = { path = "crates/context-protocol" }
context-policy = { path = "crates/context-policy" }
context-collect = { path = "crates/context-collect" }
context-store = { path = "crates/context-store" }
context-engine = { path = "crates/context-engine" }
context-eval = { path = "eval" }
context-infer = { path = "crates/context-infer" }
context-shm = { path = "crates/context-shm" }
crownos-ipc = { path = "../crownos-ipc" }
crownos-config = { path = "../crownos-config", default-features = false }
crownos-protocols = { path = "../crownos-protocols", features = ["client"] }

anyhow = "1.0.100"
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
ron = "0.12"
schemars = "1.2"
dirs = "6"
rustix = { version = "1", default-features = false, features = ["std", "fs", "mm"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
regex = "1.11"
url = "2.5"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }
wayland-client = "0.31"
tokio = { version = "1.52.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "std",
] }
tracing-journald = "0.3"
clap = { version = "4.6", features = ["derive"] }
getrandom = { version = "0.3", features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
large_enum_variant = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
cast_possible_truncation = "warn"
cast_lossless = "warn"
missing_const_for_fn = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
